name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip Project Files
      run: |
        echo "=== Descompactando ficheiro ZIP ==="
        unzip -o RastreioV2_Android_Projeto.zip -d extracted_project
        
        # Procura o ficheiro settings.gradle ou settings.gradle.kts para identificar a raiz do projeto
        PROJECT_DIR=$(find extracted_project -maxdepth 3 -name "settings.gradle*" -exec dirname {} \;)
        
        if [ -z "$PROJECT_DIR" ]; then
          echo "ERRO: Não foi possível localizar o ficheiro settings.gradle!"
          exit 1
        fi
        
        echo "Projeto encontrado em: $PROJECT_DIR"
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        cd ${{ env.PROJECT_DIR }}
        if [ -f "gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rastreio-APK
        path: "**/build/outputs/apk/debug/*.apk"
