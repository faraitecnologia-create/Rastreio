name: Build Android APK from ZIP

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o RastreioV2_Android_Projeto.zip -d .
        # Caso os ficheiros fiquem numa pasta interna ao descompactar
        if [ -d "RastreioV2_Android_Projeto" ]; then
          mv RastreioV2_Android_Projeto/* .
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rastreio-APK
        path: "**/build/outputs/apk/debug/*.apk"
